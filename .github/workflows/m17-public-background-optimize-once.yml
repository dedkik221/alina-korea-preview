name: M1.7 public master-driven background optimizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m17-public-background-optimize-once.yml'

permissions:
  contents: write

timeout-minutes: 20

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify master exists
        run: test -f 'm17/references/visual-baselines/master-1440.png'
      - name: Install renderer
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1 pngjs@7.0.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve deploy
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          sleep 2
      - name: Optimize public open-background regions
        shell: bash
        run: |
          mkdir -p m17/qa-background-opt
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { PNG } from 'pngjs';
          import fs from 'node:fs';
          const master=PNG.sync.read(fs.readFileSync('m17/references/visual-baselines/master-1440.png'));
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          await page.goto('http://127.0.0.1:4173/m17/',{waitUntil:'networkidle',timeout:60000});
          const params={light:{pos:34,brightness:1,saturation:1,contrast:1,hue:0},evening:{pos:52,brightness:1,saturation:1,contrast:1,hue:0},night:{pos:56,brightness:1,saturation:1,contrast:1,hue:0}};
          const logs=[];
          const css=()=>Object.entries(params).map(([k,p])=>`.background-scene-${k}{background-position:center ${p.pos}% !important;filter:brightness(${p.brightness}) saturate(${p.saturation}) contrast(${p.contrast}) hue-rotate(${p.hue}deg) !important;}`).join('\n');
          async function apply(){await page.evaluate(t=>{let s=document.getElementById('bg-opt-live');if(!s){s=document.createElement('style');s.id='bg-opt-live';document.head.appendChild(s)}s.textContent=t},css());await page.waitForTimeout(30)}
          const scenes={light:{clip:{x:0,y:455,width:1440,height:305},regions:[[0,0,205,305],[1235,0,205,305]]},evening:{clip:{x:0,y:855,width:1440,height:470},regions:[[0,0,170,470],[1235,0,205,470]]},night:{clip:{x:0,y:1265,width:1440,height:883},regions:[[0,0,405,450],[1190,0,250,450],[0,450,305,433],[1135,450,305,433]]}};
          function mae(png,clip,regions){let sum=0,n=0;for(const [rx,ry,rw,rh] of regions){for(let y=ry;y<ry+rh;y+=2){const gy=clip.y+y;if(gy>=master.height)continue;for(let x=rx;x<rx+rw;x+=2){const gx=clip.x+x;const a=(y*png.width+x)*4,b=(gy*master.width+gx)*4;sum+=Math.abs(png.data[a]-master.data[b])+Math.abs(png.data[a+1]-master.data[b+1])+Math.abs(png.data[a+2]-master.data[b+2]);n+=3}}}return sum/(n*255)}
          async function score(scene){await apply();const s=scenes[scene];const buf=await page.screenshot({clip:s.clip});return mae(PNG.sync.read(buf),s.clip,s.regions)}
          async function axis(scene,key,values){let best={v:params[scene][key],score:Infinity};for(const v of values){params[scene][key]=v;const sc=await score(scene);logs.push({scene,key,value:v,score:sc});if(sc<best.score)best={v,score:sc}}params[scene][key]=best.v;logs.push({scene,key,selected:best.v,selectedScore:best.score})}
          for(const scene of ['light','evening','night']){await axis(scene,'pos',[20,30,40,50,60,70,80]);await axis(scene,'brightness',[0.82,0.9,0.98,1.06,1.14,1.22]);await axis(scene,'saturation',[0.7,0.85,1,1.15,1.3]);await axis(scene,'contrast',[0.88,0.96,1.04,1.12]);await axis(scene,'hue',[-12,-6,0,6,12])}
          await apply();fs.writeFileSync('m17/qa-background-opt/report.json',JSON.stringify({params,logs},null,2));await page.screenshot({path:'m17/qa-background-opt/current-1440.png',fullPage:true});
          let text=fs.readFileSync('m17/styles.css','utf8');const start='/* BEGIN M17-TASK 39-master-background-opt */',end='/* END M17-TASK 39-master-background-opt */';const block=`${start}\n@media (min-width: 1200px) {\n${css()}\n}\n${end}`;text=text.trimEnd()+'\n\n'+block+'\n';fs.writeFileSync('m17/styles.css',text);await browser.close();
          NODE
      - name: Verify and commit
        run: |
          grep -q 'BEGIN M17-TASK 39-master-background-opt' m17/styles.css
          ! grep -nE 'assets/home/m1\.7/[^"'"'')[:space:]]+\.png' m17/index.html m17/styles.css m17/styles-base.css
          git config user.name 'M1.7 Public Background Optimizer'
          git config user.email '128158763+dedkik221@users.noreply.github.com'
          git add m17/styles.css m17/qa-background-opt
          git commit -m 'tune(m17): optimize public backgrounds against master' || exit 0
          git push origin HEAD:main
