name: M1.7 live Pages QA

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]

permissions:
  contents: read

timeout-minutes: 15

jobs:
  qa:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false playwright@1.54.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture live M1.7 geometry and screenshot
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url='https://dedkik221.github.io/alina-korea-preview/m17/';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          const consoleErrors=[];
          page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
          page.on('pageerror',e=>consoleErrors.push(String(e)));
          await page.goto(url,{waitUntil:'networkidle',timeout:60000});
          const selectors={
            header:'.site-header', heroCopy:'.hero-copy', aboutPaper:'.about-paper', facts:'.facts-grid', portrait:'.m17-about-portrait-photo',
            travelPaper:'.travel-paper', travelGrid:'.m17-travel-paper-sheet .product-grid',
            kpopPaper:'.kpop-paper', kpopGrid:'.m17-kpop-paper-sheet .product-grid',
            telegramCard:'.contact-card', telegramIcon:'.m17-telegram-icon', telegramCopy:'.contact-copy', telegramButton:'.contact-copy .button-light', telegramHandle:'.contact-handle'
          };
          const boxes={};
          for(const [name,sel] of Object.entries(selectors)){
            const loc=page.locator(sel).first();
            boxes[name]=await loc.count()?await loc.boundingBox():null;
          }
          const assets=await page.locator('[data-asset-id]').evaluateAll(els=>els.map(el=>{
            const r=el.getBoundingClientRect();
            const s=getComputedStyle(el);
            return {id:el.getAttribute('data-asset-id'),x:r.x,y:r.y,width:r.width,height:r.height,zIndex:s.zIndex,opacity:s.opacity,display:s.display};
          }));
          const brokenImages=await page.evaluate(()=>[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.src));
          const metrics={url,boxes,assets,scrollWidth:await page.evaluate(()=>document.documentElement.scrollWidth),clientWidth:await page.evaluate(()=>document.documentElement.clientWidth),scrollHeight:await page.evaluate(()=>document.documentElement.scrollHeight),brokenImages,consoleErrors};
          fs.writeFileSync('/tmp/m17-live-metrics.json',JSON.stringify(metrics,null,2));
          await page.screenshot({path:'/tmp/m17-live-1440.png',fullPage:true});
          console.log('M17_METRICS='+JSON.stringify(metrics));
          await browser.close();
          NODE

      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: m17-live-qa
          path: |
            /tmp/m17-live-1440.png
            /tmp/m17-live-metrics.json
          retention-days: 14
