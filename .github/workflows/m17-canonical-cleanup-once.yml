name: M1.7 canonical stylesheet cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m17-canonical-cleanup-once.yml'

permissions:
  contents: write

timeout-minutes: 5

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collapse public CSS to canonical block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('m17/styles.css')
          text=p.read_text(encoding='utf-8')
          start='/* BEGIN M17-TASK 37-canonical-block-layout */'
          end='/* END M17-TASK 37-canonical-block-layout */'
          m=re.search(re.escape(start)+r'.*?'+re.escape(end),text,re.S)
          if not m:
              raise SystemExit('canonical task37 block not found')
          p.write_text("@import url('./styles-base.css');\n\n"+m.group(0)+"\n",encoding='utf-8')
          PY
      - name: Verify WebP runtime and commit
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'assets/home/m1\.7/[^"'"'')[:space:]]+\.png' m17/index.html m17/styles.css m17/styles-base.css
          grep -q 'BEGIN M17-TASK 37-canonical-block-layout' m17/styles.css
          git config user.name 'M1.7 Preview Bot'
          git config user.email '128158763+dedkik221@users.noreply.github.com'
          git add m17/styles.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor(m17): collapse public CSS to canonical block'
          git push origin HEAD:main
