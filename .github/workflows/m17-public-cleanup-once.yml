name: M1.7 public cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m17-public-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-shot CI and non-runtime QA references
        run: |
          git rm -rf --ignore-unmatch \
            .github/workflows/m17-canonical-cleanup-once.yml \
            .github/workflows/m17-public-background-optimize-once.yml \
            .github/workflows/m17-page-qa.yml \
            .github/workflows/m17-public-cleanup-once.yml \
            m17/qa-background-opt \
            m17/references/visual-baselines
          git config user.name 'M1.7 Preview Cleanup Bot'
          git config user.email '128158763+dedkik221@users.noreply.github.com'
          git commit -m 'chore(m17): remove public QA and one-shot workflows' || exit 0
          git push origin HEAD:main
